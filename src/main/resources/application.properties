spring.application.name=facility-resource-service
server.port=${PORT:8081}

# Database Configuration (H2 In-Memory default for local dev, configurable via Env Vars for MySQL in Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:facility_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 Console (enabled for quick dev testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI / Swagger Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
