name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run Maven Tests
        run: ./mvnw clean test

  deploy:
    name: Deploy to Azure VM (CD)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validate Deployment Secrets
        run: |
          if [ -z "${{ secrets.AZURE_VM_HOST }}" ] || [ -z "${{ secrets.AZURE_VM_USER }}" ]; then
            echo "❌ Error: AZURE_VM_HOST or AZURE_VM_USER is not configured in GitHub Secrets."
            echo "👉 Please go to Settings -> Secrets and variables -> Actions and add:"
            echo "   - AZURE_VM_HOST (e.g. 20.205.129.149)"
            echo "   - AZURE_VM_USER (e.g. azureuser)"
            echo "   - AZURE_VM_SSH_KEY or AZURE_VM_PASSWORD"
            exit 1
          fi
          echo "✅ Secrets validated successfully."

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          port: ${{ secrets.AZURE_VM_PORT || 22 }}
          script: |
            echo "🚀 [CI/CD] Starting automated deployment for facility-resource-service..."
            
            # 1. Update source code cleanly (resets any local diffs that could block merge)
            cd ~/Micro/facility-resource-service
            git fetch origin main
            git reset --hard origin/main
            
            # 2. Rebuild and restart only the facility container
            cd ~/Micro
            echo "🐳 [CI/CD] Rebuilding and restarting facility-resource-service container..."
            docker compose up -d --build facility-resource-service
            
            # 3. Post-deployment Health Check
            echo "🩺 [CI/CD] Verifying service health..."
            sleep 10
            for i in {1..12}; do
              if curl -s -f http://localhost:8081/v3/api-docs > /dev/null; then
                echo "✅ [CI/CD] facility-resource-service is UP and healthy on port 8081!"
                exit 0
              fi
              echo "⏳ Waiting for facility-resource-service to boot (attempt $i/12)..."
              sleep 5
            done
            
            echo "❌ [CI/CD] Service did not respond within expected time."
            docker compose logs --tail=50 facility-resource-service
            exit 1
